# Easy config reload
#bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

run-shell ~/clone/path/resurrect.tmux
#set-option -g default-command "${SHELL} -l"
set-option -g default-shell /usr/bin/zsh


# Remap "Ctrl+b n" to go to the next window
bind-key n next-window

# Remap "Ctrl+b p" to go to the previous window
bind-key p previous-window

# Split pane horizontally in the same directory
bind % split-window -h -c "#{pane_current_path}"

set -g status-left ' #S    '
#set -g status-left-length 40

# List of TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect options (optional but useful)
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum options
# auto-save every 15 minutes
set -g @continuum-save-interval '15'
# auto-restore last session when tmux starts
set -g @continuum-restore 'on'

# Initialize TPM (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'


# ---- Make active window pop on tmux 3.4 ----

# Inactive windows: dimmer
set -g window-status-style "fg=default bg=default"

# Active window: bright and underlined (or bold)
set -g window-status-current-style "fg=colour46 bg=colour234"

# Show an asterisk and make current window stand out in the list
set -g window-status-format "  #I:#W  "
set -g window-status-current-format "#[bold]* #I:#W#[default]"


# Last window (previously active): show with "-" indicator
set -g window-status-last-style fg=colour220,bg=default,bold
#set -g window-status-last-format '#[bold]- #I:#W#[default]'

# Default window format for others
set -g window-status-format '  #I:#W  '
set-option -g default-shell /bin/zsh

